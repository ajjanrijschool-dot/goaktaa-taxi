<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 82" width="392" height="164" role="img" aria-label="TTAxi">
  <title>TTAxi</title>
  <desc>Wordmark with a taxi roof light above it and a pick-up to drop-off route beside it.</desc>

  <!-- Roof light -->
  <path d="M24 18 L29 5 H59 L64 18 Z" fill="#F5B02E"/>
  <rect x="22" y="16" width="44" height="6" rx="3" fill="#D8961F"/>

  <!-- Wordmark -->
  <text x="8" y="70"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="48" letter-spacing="-1"
        fill="#153A8A">TTAxi</text>

  <!-- Pick-up, and where you are going -->
  <g fill="#153A8A">
    <circle cx="152" cy="52" r="4.5"/>
    <path d="M152 52 H178" stroke="#153A8A" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M177 45 L190 52 L177 59 Z"/>
  </g>
</svg>
